<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e4fa3">
<title>Nota spese — Studio Rivelli</title>
<link rel="icon" href="assets/favicons/nota-spese.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0a1628; --blue: #1e4fa3; --blue-lt: #2d6ef0;
  --surface: #fff; --bg: #f7f9fc; --border: #e2e7f4;
  --text: #1e3050; --text-2: #4a6180; --text-3: #8fa3be;
  --ok: #1aaa6b; --danger: #d93025;
  --r2: 8px; --r3: 12px; --shadow-sm: 0 1px 4px rgba(10,22,40,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.hidden { display: none !important; }
.topbar {
  background: linear-gradient(135deg, #0a1628, #1a3a6b 60%, #1e4fa3);
  padding: 0 20px; height: 56px; display: flex; align-items: center;
  box-shadow: 0 4px 20px rgba(10,22,40,.25); position: sticky; top: 0; z-index: 100;
}
.topbar-home { color: rgba(255,255,255,.85); text-decoration: none; font-size: 13px; padding: 6px 10px; border-radius: 6px; }
.topbar-home:hover { background: rgba(255,255,255,.1); color: #fff; }
.topbar-name { color: #fff; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; margin-left: 10px; }
.shell { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }
.page-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
.page-sub { font-size: 13px; color: var(--text-2); margin-bottom: 18px; line-height: 1.45; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r3);
  box-shadow: var(--shadow-sm); padding: 18px; margin-bottom: 14px;
}
.tappa-ro {
  background: #eef2f8; border: 1px solid #d5deec; border-radius: var(--r2);
  padding: 12px 14px; font-size: 14px; font-weight: 600; color: var(--navy); margin-bottom: 16px;
}
.tappa-ro small { display: block; font-weight: 500; color: var(--text-2); margin-top: 4px; font-size: 12px; }
.step-label { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
.chip-section { margin-bottom: 18px; }
.chip-section:last-child { margin-bottom: 0; }
.chip-title {
  font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.chip-title .choice-ico { width: 28px; height: 28px; border-radius: 8px; }
.chip-title .choice-ico svg { width: 15px; height: 15px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  appearance: none; border: 1.5px solid var(--border); background: #fff;
  border-radius: 999px; padding: 10px 14px; font: inherit; font-size: 13px; font-weight: 600;
  color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  transition: border-color .15s, background .15s, color .15s;
}
.chip:hover { border-color: var(--blue-lt); background: #f5f8ff; }
.chip .chip-ico {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  background: #eff6ff; color: #2563eb;
  display: inline-flex; align-items: center; justify-content: center;
}
.chip .chip-ico svg { width: 15px; height: 15px; }
.choice-grid { display: grid; gap: 10px; }
.choice-btn {
  appearance: none; border: 1.5px solid var(--border); background: #fff; border-radius: var(--r2);
  padding: 12px 14px; font: inherit; font-size: 15px; font-weight: 600; color: var(--text);
  text-align: left; cursor: pointer; transition: border-color .15s, background .15s, color .15s;
  display: flex; align-items: center; gap: 12px; width: 100%;
}
.choice-btn:hover { border-color: var(--blue-lt); background: #f5f8ff; }
.choice-btn.is-selected { border-color: var(--blue-lt); background: #eff6ff; color: var(--blue); }
.choice-btn.is-selected .choice-ico { background: #dbeafe; color: var(--blue); }
.choice-ico {
  width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
  background: #eff6ff; color: #2563eb;
  display: inline-flex; align-items: center; justify-content: center;
}
.choice-ico svg { width: 22px; height: 22px; }
.list-item .choice-ico svg { width: 18px; height: 18px; }
.choice-label { flex: 1; min-width: 0; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; margin-bottom: 6px; }
.field input[type="text"] {
  width: 100%; border: 1.5px solid var(--border); border-radius: var(--r2); padding: 12px; font: inherit; font-size: 16px;
}
.field-with-ico { display: flex; align-items: flex-start; gap: 12px; }
.field-with-ico .choice-ico { margin-top: 18px; }
.field-with-ico .field { flex: 1; margin-bottom: 0; }
.photo-actions {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px;
  justify-content: center; align-items: center;
}
.btn-cam {
  background: #e8ebf0; border: 1.5px solid #cfd6e0; color: #3a4a60;
}
.btn-cam:hover { background: #dde2ea; border-color: #b8c2d0; }
.btn-gal {
  background: #e6f6ee; border: 1.5px solid #b7e4cb; color: #0f7a45;
}
.btn-gal:hover { background: #d5f0e2; border-color: #95d4b0; }
.btn {
  appearance: none; border: none; border-radius: var(--r2); padding: 12px 16px; font: inherit; font-weight: 600;
  cursor: pointer; font-size: 14px;
}
.btn-primary { background: var(--blue-lt); color: #fff; }
.btn-primary:disabled { opacity: .55; cursor: not-allowed; }
.btn-ghost { background: #fff; border: 1.5px solid var(--border); color: var(--text); }
.btn-with-ico { display: inline-flex; align-items: center; gap: 8px; }
.btn-with-ico svg { width: 18px; height: 18px; flex-shrink: 0; }
.btn-row { display: flex; gap: 10px; justify-content: space-between; margin-top: 16px; }
.preview { max-width: 100%; border-radius: var(--r2); border: 1px solid var(--border); max-height: 220px; object-fit: contain; background: #f3f4f6; }
.compose-ctx {
  font-size: 13px; color: var(--text-2); margin-bottom: 14px; padding: 10px 12px;
  background: #f5f8ff; border: 1px solid #dbeafe; border-radius: var(--r2);
}
.list-item {
  display: flex; justify-content: space-between; gap: 10px; align-items: center;
  width: 100%; padding: 10px 4px; border: none; border-bottom: 1px solid var(--border);
  background: transparent; font: inherit; font-size: 13px; color: inherit;
  text-align: left; cursor: pointer; border-radius: 6px;
}
.list-item:last-child { border-bottom: none; }
.list-item:hover { background: #f5f8ff; }
.list-item-main { flex: 1; min-width: 0; }
.list-item-amt { font-weight: 700; white-space: nowrap; }
.list-item-info {
  flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: #eff6ff; color: var(--blue); border: 1px solid #dbeafe;
}
.list-item-info svg { width: 16px; height: 16px; }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 3000; background: rgba(10,22,40,.45);
  display: none; align-items: flex-end; justify-content: center; padding: 16px;
}
.modal-backdrop.open { display: flex; }
.modal-sc {
  width: min(520px, 100%); background: var(--surface); border-radius: var(--r3);
  box-shadow: 0 12px 40px rgba(10,22,40,.25); overflow: hidden; max-height: min(90vh, 720px);
  display: flex; flex-direction: column;
}
.modal-head { padding: 16px 18px 8px; }
.modal-head h2 { font-family: 'Syne', sans-serif; font-size: 17px; color: var(--navy); }
.modal-body { padding: 8px 18px 16px; overflow: auto; }
.modal-foot {
  display: flex; gap: 10px; justify-content: flex-end; align-items: center;
  padding: 12px 18px 16px; border-top: 1px solid var(--border);
}
.sc-view-img { width: 100%; max-height: min(52vh, 420px); object-fit: contain; border-radius: 10px; background: #f3f4f6; display: block; }
.sc-view-dl { margin-top: 12px; }
.sc-view-dl dt { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--text-3); margin-top: 10px; }
.sc-view-dl dd { margin: 4px 0 0; font-size: 14px; color: var(--text); }
.btn-icon { width: 42px; height: 42px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.btn-chiudi { background: #fde8e8; border: 1.5px solid #f5c2c2; color: #b42318; }
.sc-ico-sm { width: 18px; height: 18px; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(80px);
  background: var(--navy); color: #fff; padding: 12px 16px; border-radius: var(--r2);
  font-size: 13px; z-index: 11000; opacity: 0; transition: .25s; max-width: calc(100vw - 32px);
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok { background: var(--ok); }
.toast.err { background: var(--danger); }
.app-loader {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(247, 249, 252, .94); backdrop-filter: blur(6px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  transition: opacity .35s ease, visibility .35s ease;
}
.app-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.app-loader-spinner {
  width: 46px; height: 46px; border-radius: 50%;
  border: 3px solid #e2e7f4; border-top-color: var(--blue-lt);
  animation: app-spin .7s linear infinite;
}
.app-loader-text { font-size: 14px; color: var(--text-2); }
@keyframes app-spin { to { transform: rotate(360deg); } }
.empty { font-size: 14px; color: var(--text-2); padding: 8px 0; }
</style>
</head>
<body>
<div class="topbar">
  <a class="topbar-home" href="index.html">← Home</a>
  <span class="topbar-name">Nota spese</span>
</div>

<main class="shell">
  <h1 class="page-title">Gestione trasferte</h1>
  <p class="page-sub">Pannello di gestione nota spese — giustificativi della tappa in corso.</p>

  <div id="no-tappa" class="card hidden">
    <p class="empty">Nessuna tappa in corso oggi. Torna all’home.</p>
    <a class="btn btn-ghost" href="index.html">Torna all’home</a>
  </div>

  <div id="panel" class="hidden">
    <div class="tappa-ro" id="tappa-label">—</div>

    <div class="card" id="chip-card">
      <div class="step-label">Aggiungi giustificativo</div>
      <div id="chip-board"></div>
    </div>

    <div class="card">
      <div class="step-label">Già caricati</div>
      <div id="lista-esistenti"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast" role="status"></div>
<div class="app-loader is-hidden" id="app-loader" aria-live="polite" aria-busy="false">
  <div class="app-loader-spinner" role="status" aria-label="Caricamento"></div>
  <p class="app-loader-text">Caricamento su Drive…</p>
</div>

<div class="modal-backdrop" id="altro-backdrop" aria-hidden="true">
  <div class="modal-sc" role="dialog" aria-modal="true" aria-labelledby="altro-title">
    <div class="modal-head"><h2 id="altro-title">Altro</h2></div>
    <div class="modal-body">
      <div class="field">
        <label for="altro-dettaglio">Di cosa si tratta?</label>
        <input type="text" id="altro-dettaglio" placeholder="es. Pedaggio, lavanderia…" maxlength="120" autocomplete="off">
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" id="altro-annulla">Annulla</button>
      <button type="button" class="btn btn-primary" id="altro-conferma">Conferma</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="compose-backdrop" aria-hidden="true">
  <div class="modal-sc" role="dialog" aria-modal="true" aria-labelledby="compose-title">
    <div class="modal-head"><h2 id="compose-title">Documento</h2></div>
    <div class="modal-body">
      <div class="compose-ctx" id="compose-ctx">—</div>
      <div id="compose-body"></div>
    </div>
    <div class="modal-foot" id="compose-foot">
      <button type="button" class="btn btn-ghost" id="compose-back">Indietro</button>
      <button type="button" class="btn btn-primary" id="compose-next">Avanti</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="nota-view-backdrop" aria-hidden="true">
  <div class="modal-sc" role="dialog" aria-modal="true" aria-labelledby="ns-view-title">
    <div class="modal-head"><h2 id="ns-view-title">Giustificativo</h2></div>
    <div class="modal-body">
      <img id="ns-view-img" class="sc-view-img" alt="Giustificativo">
      <dl class="sc-view-dl">
        <dt>Voce</dt>
        <dd id="ns-view-cat">—</dd>
        <dt>Importo</dt>
        <dd id="ns-view-importo">—</dd>
        <dt>Orario</dt>
        <dd id="ns-view-orario">—</dd>
      </dl>
    </div>
    <div class="modal-foot">
      <a class="btn btn-ghost btn-icon" id="ns-view-download" href="#" download title="Scarica" aria-label="Scarica"></a>
      <button type="button" class="btn btn-ghost btn-icon" id="ns-view-print" title="Stampa" aria-label="Stampa"></button>
      <button type="button" class="btn btn-chiudi" id="ns-view-chiudi">Chiudi</button>
    </div>
  </div>
</div>

<input type="file" id="file-camera" accept="image/*" capture="environment" class="hidden">
<input type="file" id="file-gallery" accept="image/*" class="hidden">

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.0/lib/msal-browser.min.js"></script>
<script src="js/config.js?v=37"></script>
<script src="js/nota-spese.js?v=37"></script>
<script src="js/scontrini.js?v=37"></script>
<script src="js/auth.js?v=37"></script>
<script>
const state = {
  phase: 'tipo', // tipo | dettaglio
  categoria: null,
  pasto: null,
  mezzo: null,
  dettaglio: null,
  tipo: null,
  importo: '',
  photo: null,
  tappa: null
};

function toast(msg, kind) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind === 'ok' ? ' ok' : kind === 'err' ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 3200);
}

function showLoader(text) {
  const el = document.getElementById('app-loader');
  const t = el.querySelector('.app-loader-text');
  if (t && text) t.textContent = text;
  el.classList.remove('is-hidden');
  el.setAttribute('aria-busy', 'true');
}
function hideLoader() {
  const el = document.getElementById('app-loader');
  el.classList.add('is-hidden');
  el.setAttribute('aria-busy', 'false');
}

const SVG_ATTR = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
function svgIcon(paths) {
  return '<svg ' + SVG_ATTR + '>' + paths + '</svg>';
}

const CHOICE_ICONS = {
  cibi_bevande: svgIcon('<path d="M8 3v8a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3"/><path d="M10 13v8"/><path d="M16 3v18"/><path d="M16 8h2a2 2 0 0 1 0 4h-2"/>'),
  mezzi: svgIcon('<path d="M4 16l1.5-6h13L20 16"/><path d="M3 16h18v2a1 1 0 0 1-1 1h-1a2 2 0 0 1-4 0H9a2 2 0 0 1-4 0H4a1 1 0 0 1-1-1v-2z"/>'),
  altro: svgIcon('<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>'),
  colazione: svgIcon('<path d="M6 10h10a4 4 0 0 1 0 8H6z"/><path d="M6 10V8a2 2 0 0 1 2-2h4"/><path d="M18 8c1.2.4 2 1.4 2 2.8"/><path d="M8 21h8"/>'),
  pranzo: svgIcon('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2"/>'),
  cena: svgIcon('<path d="M12 4c-3 2.5-5 5.5-5 9a5 5 0 0 0 10 0c0-3.5-2-6.5-5-9z"/><path d="M9 21h6"/><path d="M12 17v4"/>'),
  taxi: svgIcon('<path d="M4 15l1.5-5h13L20 15"/><path d="M3 15h18v3H3z"/><circle cx="7.5" cy="18.5" r="1.5"/><circle cx="16.5" cy="18.5" r="1.5"/><path d="M9 8h6l1 2H8z"/>'),
  treno: svgIcon('<rect x="6" y="3" width="12" height="14" rx="2"/><path d="M6 10h12M9 17l-2 3M15 17l2 3M10 6h4"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/>'),
  autobus: svgIcon('<rect x="4" y="4" width="16" height="12" rx="2"/><path d="M4 10h16M8 16v2M16 16v2"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/>'),
  benzina: svgIcon('<path d="M5 21V7l2-4h8l2 4v14"/><path d="M5 11h12"/><path d="M17 11l3 2v5a1.5 1.5 0 0 1-3 0"/><path d="M9 15h4"/>'),
  scontrino: svgIcon('<path d="M6 3.5h12v17l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2-2 1.2V3.5z"/><path d="M9 8h6M9 12h6M9 16h4"/>'),
  fattura: svgIcon('<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M10 12h5M10 16h5M10 8h2"/>'),
  importo: svgIcon('<circle cx="12" cy="12" r="9"/><path d="M12 6v12"/><path d="M15.5 9.5c-.6-1.2-1.8-2-3.5-2-2 0-3.5 1.2-3.5 2.8S10 13 12 13s3.5 1 3.5 2.7c0 1.6-1.5 2.8-3.5 2.8-1.7 0-2.9-.8-3.5-2"/>'),
  camera: svgIcon('<path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),
  gallery: svgIcon('<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M3 16l5-4 4 3 3-2 6 3"/>')
};

const ICO_INFO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>';

function openBackdrop(id) {
  const el = document.getElementById(id);
  el.classList.add('open');
  el.setAttribute('aria-hidden', 'false');
}
function closeBackdrop(id) {
  const el = document.getElementById(id);
  el.classList.remove('open');
  el.setAttribute('aria-hidden', 'true');
}

function resetComposeFields() {
  state.tipo = null;
  state.importo = '';
  state.photo = null;
}

function selectionLabel() {
  if (SRNotaSpese && typeof SRNotaSpese.labelVoce === 'function') {
    return SRNotaSpese.labelVoce({
      categoria: state.categoria,
      pasto: state.pasto,
      mezzo: state.mezzo,
      dettaglio: state.dettaglio
    });
  }
  return [state.categoria, state.pasto || state.mezzo || state.dettaglio].filter(Boolean).join(' · ');
}

function startCompose(sel) {
  state.categoria = sel.categoria;
  state.pasto = sel.pasto || null;
  state.mezzo = sel.mezzo || null;
  state.dettaglio = sel.dettaglio || null;
  resetComposeFields();
  state.phase = 'tipo';
  renderCompose();
  openBackdrop('compose-backdrop');
}

function renderChipBoard() {
  const board = document.getElementById('chip-board');
  const pasti = (SRNotaSpese && SRNotaSpese.PASTI) || [
    { id: 'colazione', label: 'Colazione' },
    { id: 'pranzo', label: 'Pranzo' },
    { id: 'cena', label: 'Cena' }
  ];
  const mezzi = (SRNotaSpese && SRNotaSpese.MEZZI) || [
    { id: 'taxi', label: 'Taxi' },
    { id: 'treno', label: 'Treno' },
    { id: 'autobus', label: 'Autobus' },
    { id: 'benzina', label: 'Benzina' }
  ];
  function chips(list) {
    return '<div class="chip-row">' + list.map(item => {
      const ico = CHOICE_ICONS[item.id] || CHOICE_ICONS.altro;
      return '<button type="button" class="chip" data-id="' + item.id + '">'
        + '<span class="chip-ico">' + ico + '</span>' + item.label + '</button>';
    }).join('') + '</div>';
  }

  board.innerHTML =
    '<div class="chip-section">'
    + '<div class="chip-title"><span class="choice-ico">' + CHOICE_ICONS.cibi_bevande + '</span>Cibi e bevande</div>'
    + chips(pasti)
    + '</div>'
    + '<div class="chip-section">'
    + '<div class="chip-title"><span class="choice-ico">' + CHOICE_ICONS.mezzi + '</span>Mezzi</div>'
    + chips(mezzi)
    + '</div>'
    + '<div class="chip-section">'
    + '<div class="chip-title"><span class="choice-ico">' + CHOICE_ICONS.altro + '</span>Altro</div>'
    + '<div class="chip-row"><button type="button" class="chip" id="chip-altro">'
    + '<span class="chip-ico">' + CHOICE_ICONS.altro + '</span>Altro</button></div>'
    + '</div>';

  board.querySelectorAll('.chip-section')[0].querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => startCompose({
      categoria: 'cibi_bevande',
      pasto: btn.dataset.id
    }));
  });
  board.querySelectorAll('.chip-section')[1].querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => startCompose({
      categoria: 'mezzi',
      mezzo: btn.dataset.id
    }));
  });
  document.getElementById('chip-altro').addEventListener('click', () => {
    document.getElementById('altro-dettaglio').value = '';
    openBackdrop('altro-backdrop');
    setTimeout(() => document.getElementById('altro-dettaglio').focus(), 50);
  });
}

function renderChoices(list, selected) {
  return list.map(item => {
    const sel = selected === item.id ? ' is-selected' : '';
    const ico = CHOICE_ICONS[item.id] || svgIcon('<circle cx="12" cy="12" r="8"/>');
    return '<button type="button" class="choice-btn' + sel + '" data-id="' + item.id + '">'
      + '<span class="choice-ico">' + ico + '</span>'
      + '<span class="choice-label">' + item.label + '</span>'
      + '</button>';
  }).join('');
}

function renderCompose() {
  document.getElementById('compose-ctx').textContent = selectionLabel();
  const body = document.getElementById('compose-body');
  const back = document.getElementById('compose-back');
  const next = document.getElementById('compose-next');

  if (state.phase === 'tipo') {
    document.getElementById('compose-title').textContent = 'Scontrino o fattura';
    back.textContent = 'Annulla';
    next.style.display = 'none';
    body.innerHTML = '<div class="choice-grid">' + renderChoices(SRNotaSpese.TIPI, state.tipo) + '</div>';
    body.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.tipo = btn.dataset.id;
        state.phase = 'dettaglio';
        renderCompose();
      });
    });
    return;
  }

  document.getElementById('compose-title').textContent = 'Importo e foto';
  back.textContent = 'Indietro';
  next.style.display = '';
  next.textContent = 'Salva';
  const prev = state.photo
    ? '<img class="preview" alt="Anteprima" src="' + state.photo.dataUrl + '">'
    : '<p class="empty">Scatta o scegli una foto dello scontrino/fattura.</p>';
  body.innerHTML =
    '<div class="field-with-ico">'
    + '<span class="choice-ico">' + CHOICE_ICONS.importo + '</span>'
    + '<div class="field"><label for="ns-importo">Euro</label>'
    + '<input type="text" id="ns-importo" inputmode="decimal" placeholder="es. 12,50" value="'
    + (state.importo || '') + '"></div></div>'
    + '<div class="photo-actions" style="margin-top:14px">'
    + '<button type="button" class="btn btn-cam btn-with-ico" id="btn-cam">' + CHOICE_ICONS.camera + ' Fotocamera</button>'
    + '<button type="button" class="btn btn-gal btn-with-ico" id="btn-gal">' + CHOICE_ICONS.gallery + ' Galleria</button>'
    + '</div>' + prev;
  const inp = document.getElementById('ns-importo');
  inp.addEventListener('input', () => { state.importo = inp.value; });
  document.getElementById('btn-cam').onclick = () => document.getElementById('file-camera').click();
  document.getElementById('btn-gal').onclick = () => document.getElementById('file-gallery').click();
  inp.focus();
}

function chiudiCompose() {
  closeBackdrop('compose-backdrop');
  state.phase = 'tipo';
  state.categoria = null;
  state.pasto = null;
  state.mezzo = null;
  state.dettaglio = null;
  resetComposeFields();
}

function renderLista() {
  const box = document.getElementById('lista-esistenti');
  const list = SRNotaSpese.parseNotaSpeseJson(state.tappa && state.tappa.nota_spese_json);
  if (!list.length) {
    box.innerHTML = '<p class="empty">Nessun giustificativo su questa tappa.</p>';
    return;
  }
  box.innerHTML = list.map((it, i) => {
    const euro = Number(it.importo).toFixed(2).replace('.', ',');
    const icoKey = it.pasto || it.mezzo || it.categoria || 'scontrino';
    const catIco = CHOICE_ICONS[icoKey] || CHOICE_ICONS.scontrino;
    const voce = (SRNotaSpese.labelVoce && SRNotaSpese.labelVoce(it))
      || ((it.categoria || '') + (it.pasto ? ' · ' + it.pasto : '') + (it.mezzo ? ' · ' + it.mezzo : '') + (it.dettaglio ? ' · ' + it.dettaglio : ''));
    return '<button type="button" class="list-item" data-view-idx="' + i + '" title="Apri giustificativo">'
      + '<span class="choice-ico" style="width:34px;height:34px;border-radius:9px">' + catIco + '</span>'
      + '<span class="list-item-main">' + (it.tipo || '') + ' · ' + voce + '</span>'
      + '<strong class="list-item-amt">€ ' + euro + '</strong>'
      + '<span class="list-item-info">' + ICO_INFO + '</span>'
      + '</button>';
  }).join('');
  box.querySelectorAll('[data-view-idx]').forEach(btn => {
    btn.addEventListener('click', () => apriNotaViewer(list[Number(btn.dataset.viewIdx)]));
  });
}

function apriNotaViewer(it) {
  if (!it) return;
  const img = document.getElementById('ns-view-img');
  img.onerror = () => { img.style.display = 'none'; };
  img.style.display = '';
  img.src = SRScontrini.thumbnailUrl(it);
  const tipo = String(it.tipo || '').toLowerCase() === 'fattura' ? 'Fattura' : 'Scontrino';
  document.getElementById('ns-view-title').textContent = tipo;
  document.getElementById('ns-view-cat').textContent = SRNotaSpese.labelVoce(it);
  document.getElementById('ns-view-importo').textContent =
    '€ ' + Number(it.importo).toFixed(2).replace('.', ',');
  document.getElementById('ns-view-orario').textContent = it.created_at
    ? new Date(it.created_at).toLocaleString('it-IT')
    : '—';
  const a = document.getElementById('ns-view-download');
  a.innerHTML = SRScontrini.ICO_DOWNLOAD;
  a.href = SRScontrini.downloadUrl(it);
  a.setAttribute('download', 'giustificativo.png');
  const printBtn = document.getElementById('ns-view-print');
  printBtn.innerHTML = SRScontrini.ICO_PRINT;
  printBtn.onclick = () => {
    const w = window.open('', '_blank');
    if (!w) return;
    const src = SRScontrini.thumbnailUrl(it);
    w.document.write('<title>Giustificativo</title><img src="' + src.replace(/"/g, '') + '" style="max-width:100%">');
    w.document.close();
    setTimeout(() => w.print(), 400);
  };
  openBackdrop('nota-view-backdrop');
}

function readFile(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function onFile(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  if (!file.type.startsWith('image/')) return toast('Solo immagini', 'err');
  const dataUrl = await readFile(file);
  state.photo = { dataUrl, mime: file.type || 'image/jpeg' };
  if (state.phase === 'dettaglio') renderCompose();
}

async function postGoogleScript(payload) {
  const url = (SR_CONFIG || {}).GOOGLE_SCRIPT_URL;
  if (!url || String(url).includes('INSERISCI')) throw new Error('GOOGLE_SCRIPT_URL non configurato');
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const text = await resp.text();
  let data;
  try { data = JSON.parse(text); } catch { throw new Error('Risposta Drive non valida'); }
  if (!data.ok) throw new Error(data.message || 'Upload Drive fallito');
  return data;
}

async function salva() {
  try { SRNotaSpese.parseImporto(state.importo); } catch {
    return toast('Inserisci un importo valido', 'err');
  }
  if (!state.photo || !state.photo.dataUrl) return toast('Aggiungi una foto', 'err');
  if (!state.tipo) return toast('Scegli scontrino o fattura', 'err');

  const u = SRAuth.getUser() || {};
  showLoader('Caricamento foto su Drive…');
  try {
    const up = await postGoogleScript({
      action: 'uploadNotaSpesa',
      photo: state.photo.dataUrl,
      email: u.email || '',
      trasferta_id: String(state.tappa.trasferta_id || ''),
      tappa_numero: String(state.tappa.tappa_numero || '')
    });
    showLoader('Salvataggio in archivio…');
    const item = {
      id: SRNotaSpese.uid(),
      tipo: state.tipo,
      categoria: state.categoria,
      pasto: state.pasto,
      mezzo: state.mezzo,
      dettaglio: state.dettaglio,
      importo: state.importo,
      foto_url: up.url,
      foto_id: up.fileId,
      mime: up.mime || state.photo.mime
    };
    const resp = await SRAuth.fetch(SR_CONFIG.WEBHOOK_APPEND_NOTA_SPESA, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'append_nota_spesa',
        id: Number(state.tappa.id),
        nota: item
      })
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok || data.ok === false || data.action === 'error') {
      throw new Error(data.message || ('Salvataggio fallito: ' + resp.status));
    }
    const json = data.nota_spese_json || SRNotaSpese.stringify(data.note || SRNotaSpese.appendNotaSpesa(state.tappa.nota_spese_json, item));
    SRAuth.updateTappaNotaSpese(state.tappa.id, json, data.note);
    const refreshed = SRAuth.getTrasferteTappe().find(r => Number(r.id) === Number(state.tappa.id));
    if (refreshed) state.tappa = refreshed;
    chiudiCompose();
    renderLista();
    hideLoader();
    toast('Giustificativo salvato', 'ok');
  } catch (e) {
    hideLoader();
    toast(e.message || String(e), 'err');
  }
}

document.getElementById('file-camera').addEventListener('change', e => onFile(e.target));
document.getElementById('file-gallery').addEventListener('change', e => onFile(e.target));

document.getElementById('altro-annulla').addEventListener('click', () => closeBackdrop('altro-backdrop'));
document.getElementById('altro-conferma').addEventListener('click', () => {
  const dettaglio = String(document.getElementById('altro-dettaglio').value || '').trim();
  if (!dettaglio) return toast('Specifica di cosa si tratta', 'err');
  closeBackdrop('altro-backdrop');
  startCompose({ categoria: 'altro', dettaglio });
});
document.getElementById('altro-backdrop').addEventListener('click', e => {
  if (e.target.id === 'altro-backdrop') closeBackdrop('altro-backdrop');
});

document.getElementById('compose-back').addEventListener('click', () => {
  if (state.phase === 'dettaglio') {
    state.phase = 'tipo';
    state.importo = '';
    state.photo = null;
    renderCompose();
    return;
  }
  chiudiCompose();
});
document.getElementById('compose-next').addEventListener('click', () => {
  if (state.phase === 'dettaglio') salva();
});
document.getElementById('compose-backdrop').addEventListener('click', e => {
  if (e.target.id === 'compose-backdrop') chiudiCompose();
});

document.getElementById('ns-view-chiudi').addEventListener('click', () => closeBackdrop('nota-view-backdrop'));
document.getElementById('nota-view-backdrop').addEventListener('click', e => {
  if (e.target.id === 'nota-view-backdrop') closeBackdrop('nota-view-backdrop');
});

(async function boot() {
  try {
    if (!window.SRAuth || !window.SRNotaSpese) {
      throw new Error('Script nota-spese/auth non caricati. Aggiorna la cache (hard refresh).');
    }
    if (!SRAuth.hasN8nToken()) await SRAuth.ensureN8nSession();
    if (!SRAuth.canAccessHubApp('nota_spese')) {
      location.replace('index.html');
      return;
    }
    const tappe = SRAuth.getTrasferteTappe();
    const tappa = SRNotaSpese.tappaAttuale(tappe);
    if (!tappa) {
      document.getElementById('no-tappa').classList.remove('hidden');
      return;
    }
    state.tappa = tappa;
    document.getElementById('panel').classList.remove('hidden');
    document.getElementById('tappa-label').innerHTML =
      SRNotaSpese.labelTappa(tappa)
      + '<small>' + (tappa.trasferta_id || '') + (tappa.cliente_tappa ? ' · ' + tappa.cliente_tappa : '') + '</small>';
    renderChipBoard();
    renderLista();
  } catch (ex) {
    console.error('nota-spese boot:', ex);
    if (SRAuth && SRAuth.isNotEnabledError && SRAuth.isNotEnabledError(ex)) {
      SRAuth.redirectNotEnabled();
      return;
    }
    // Non mascherare bug JS / cache come "workflow n8n"
    const msg = (ex && ex.message) ? String(ex.message) : String(ex || 'Errore');
    if (/token|sessione|microsoft|n8n|api|network|fetch|Failed to fetch/i.test(msg)) {
      if (SRAuth && SRAuth.redirectToLogin) SRAuth.redirectToLogin('api');
      else location.replace('index.html?err=api');
      return;
    }
    document.body.insertAdjacentHTML('afterbegin',
      '<div style="margin:16px;padding:14px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;color:#b42318;font:14px DM Sans,sans-serif">'
      + 'Errore apertura Nota spese: ' + msg.replace(/[<>&]/g, '')
      + '<br><a href="index.html">Torna alla home</a></div>');
  }
})();
</script>
