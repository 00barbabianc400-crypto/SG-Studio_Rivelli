<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e4fa3">
<title>Nota spese — Studio Rivelli</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0a1628; --blue: #1e4fa3; --blue-lt: #2d6ef0;
  --surface: #fff; --bg: #f7f9fc; --border: #e2e7f4;
  --text: #1e3050; --text-2: #4a6180; --text-3: #8fa3be;
  --ok: #1aaa6b; --warn: #b86e00; --danger: #d93025;
  --r2: 8px; --r3: 12px; --shadow-sm: 0 1px 4px rgba(10,22,40,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.hidden { display: none !important; }
.topbar {
  background: linear-gradient(135deg, #0a1628, #1a3a6b 60%, #1e4fa3);
  padding: 0 20px; height: 56px; display: flex; align-items: center;
  box-shadow: 0 4px 20px rgba(10,22,40,.25); position: sticky; top: 0; z-index: 100;
}
.topbar-home { color: rgba(255,255,255,.85); text-decoration: none; font-size: 13px; padding: 6px 10px; border-radius: 6px; }
.topbar-home:hover { background: rgba(255,255,255,.1); color: #fff; }
.topbar-name { color: #fff; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; margin-left: 10px; }
.shell { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }
.page-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
.page-sub { font-size: 13px; color: var(--text-2); margin-bottom: 18px; line-height: 1.45; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r3);
  box-shadow: var(--shadow-sm); padding: 18px; margin-bottom: 14px;
}
.tappa-ro {
  background: #eef2f8; border: 1px solid #d5deec; border-radius: var(--r2);
  padding: 12px 14px; font-size: 14px; font-weight: 600; color: var(--navy); margin-bottom: 16px;
}
.tappa-ro small { display: block; font-weight: 500; color: var(--text-2); margin-top: 4px; font-size: 12px; }
.step-label { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
.choice-grid { display: grid; gap: 10px; }
.choice-btn {
  appearance: none; border: 1.5px solid var(--border); background: #fff; border-radius: var(--r2);
  padding: 14px 16px; font: inherit; font-size: 15px; font-weight: 600; color: var(--text);
  text-align: left; cursor: pointer; transition: border-color .15s, background .15s;
}
.choice-btn:hover { border-color: var(--blue-lt); background: #f5f8ff; }
.choice-btn.is-selected { border-color: var(--blue-lt); background: #eff6ff; color: var(--blue); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; margin-bottom: 6px; }
.field input[type="number"], .field input[type="text"] {
  width: 100%; border: 1.5px solid var(--border); border-radius: var(--r2); padding: 12px; font: inherit; font-size: 16px;
}
.photo-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.btn {
  appearance: none; border: none; border-radius: var(--r2); padding: 12px 16px; font: inherit; font-weight: 600;
  cursor: pointer; font-size: 14px;
}
.btn-primary { background: var(--blue-lt); color: #fff; }
.btn-primary:disabled { opacity: .55; cursor: not-allowed; }
.btn-ghost { background: #fff; border: 1.5px solid var(--border); color: var(--text); }
.btn-row { display: flex; gap: 10px; justify-content: space-between; margin-top: 16px; }
.preview { max-width: 100%; border-radius: var(--r2); border: 1px solid var(--border); max-height: 220px; object-fit: contain; background: #f3f4f6; }
.list-item {
  display: flex; justify-content: space-between; gap: 10px; align-items: center;
  width: 100%; padding: 10px 4px; border: none; border-bottom: 1px solid var(--border);
  background: transparent; font: inherit; font-size: 13px; color: inherit;
  text-align: left; cursor: pointer; border-radius: 6px;
}
.list-item:last-child { border-bottom: none; }
.list-item:hover { background: #f5f8ff; }
.list-item-main { flex: 1; min-width: 0; }
.list-item-amt { font-weight: 700; white-space: nowrap; }
.list-item-info {
  flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: #eff6ff; color: var(--blue); border: 1px solid #dbeafe;
}
.list-item-info svg { width: 16px; height: 16px; }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 3000; background: rgba(10,22,40,.45);
  display: none; align-items: flex-end; justify-content: center; padding: 16px;
}
.modal-backdrop.open { display: flex; }
.modal-sc {
  width: min(520px, 100%); background: var(--surface); border-radius: var(--r3);
  box-shadow: 0 12px 40px rgba(10,22,40,.25); overflow: hidden; max-height: min(90vh, 720px);
  display: flex; flex-direction: column;
}
.modal-head { padding: 16px 18px 8px; }
.modal-head h2 { font-family: 'Syne', sans-serif; font-size: 17px; color: var(--navy); }
.modal-body { padding: 8px 18px 16px; overflow: auto; }
.modal-foot {
  display: flex; gap: 10px; justify-content: flex-end; align-items: center;
  padding: 12px 18px 16px; border-top: 1px solid var(--border);
}
.sc-view-img { width: 100%; max-height: min(52vh, 420px); object-fit: contain; border-radius: 10px; background: #f3f4f6; display: block; }
.sc-view-dl { margin-top: 12px; }
.sc-view-dl dt { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--text-3); margin-top: 10px; }
.sc-view-dl dd { margin: 4px 0 0; font-size: 14px; color: var(--text); }
.btn-icon { width: 42px; height: 42px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.btn-chiudi { background: #fde8e8; border: 1.5px solid #f5c2c2; color: #b42318; }
.sc-ico-sm { width: 18px; height: 18px; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(80px);
  background: var(--navy); color: #fff; padding: 12px 16px; border-radius: var(--r2);
  font-size: 13px; z-index: 2000; opacity: 0; transition: .25s; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok { background: var(--ok); }
.toast.err { background: var(--danger); }
.app-loader {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(247, 249, 252, .94); backdrop-filter: blur(6px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  transition: opacity .35s ease, visibility .35s ease;
}
.app-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.app-loader-spinner {
  width: 46px; height: 46px; border-radius: 50%;
  border: 3px solid #e2e7f4; border-top-color: var(--blue-lt);
  animation: app-spin .7s linear infinite;
}
.app-loader-text { font-size: 14px; color: var(--text-2); }
@keyframes app-spin { to { transform: rotate(360deg); } }
.empty { font-size: 14px; color: var(--text-2); padding: 8px 0; }
</style>
</head>
<body>
<div class="topbar">
  <a class="topbar-home" href="index.html">← Home</a>
  <span class="topbar-name">Nota spese</span>
</div>

<main class="shell">
  <h1 class="page-title">Gestione trasferte</h1>
  <p class="page-sub">Pannello di gestione nota spese — giustificativi della tappa in corso.</p>

  <div id="no-tappa" class="card hidden">
    <p class="empty">Nessuna tappa in corso oggi. Torna all’home.</p>
    <a class="btn btn-ghost" href="index.html">Torna all’home</a>
  </div>

  <div id="panel" class="hidden">
    <div class="tappa-ro" id="tappa-label">—</div>

    <div class="card">
      <div class="step-label" id="step-title">Categoria</div>
      <div id="step-body"></div>
      <div class="btn-row">
        <button type="button" class="btn btn-ghost" id="btn-back">Indietro</button>
        <button type="button" class="btn btn-primary" id="btn-next">Avanti</button>
      </div>
    </div>

    <div class="card">
      <div class="step-label">Già caricati</div>
      <div id="lista-esistenti"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast" role="status"></div>
<div class="app-loader is-hidden" id="app-loader" aria-live="polite" aria-busy="false">
  <div class="app-loader-spinner" role="status" aria-label="Caricamento"></div>
  <p class="app-loader-text">Caricamento su Drive…</p>
</div>

<div class="modal-backdrop" id="nota-view-backdrop" aria-hidden="true">
  <div class="modal-sc" role="dialog" aria-modal="true" aria-labelledby="ns-view-title">
    <div class="modal-head"><h2 id="ns-view-title">Giustificativo</h2></div>
    <div class="modal-body">
      <img id="ns-view-img" class="sc-view-img" alt="Giustificativo">
      <dl class="sc-view-dl">
        <dt>Categoria</dt>
        <dd id="ns-view-cat">—</dd>
        <dt>Importo</dt>
        <dd id="ns-view-importo">—</dd>
        <dt>Orario</dt>
        <dd id="ns-view-orario">—</dd>
      </dl>
    </div>
    <div class="modal-foot">
      <a class="btn btn-ghost btn-icon" id="ns-view-download" href="#" download title="Scarica" aria-label="Scarica"></a>
      <button type="button" class="btn btn-ghost btn-icon" id="ns-view-print" title="Stampa" aria-label="Stampa"></button>
      <button type="button" class="btn btn-chiudi" id="ns-view-chiudi">Chiudi</button>
    </div>
  </div>
</div>

<input type="file" id="file-camera" accept="image/*" capture="environment" class="hidden">
<input type="file" id="file-gallery" accept="image/*" class="hidden">

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.0/lib/msal-browser.min.js"></script>
<script src="js/config.js"></script>
<script src="js/nota-spese.js"></script>
<script src="js/scontrini.js"></script>
<script src="js/auth.js"></script>
<script>
const state = {
  step: 0,
  categoria: null,
  pasto: null,
  tipo: null,
  importo: '',
  photo: null,
  tappa: null
};

function toast(msg, kind) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind === 'ok' ? ' ok' : kind === 'err' ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 3200);
}

function showLoader(text) {
  const el = document.getElementById('app-loader');
  const t = el.querySelector('.app-loader-text');
  if (t && text) t.textContent = text;
  el.classList.remove('is-hidden');
  el.setAttribute('aria-busy', 'true');
}
function hideLoader() {
  const el = document.getElementById('app-loader');
  el.classList.add('is-hidden');
  el.setAttribute('aria-busy', 'false');
}

function stepsForCategoria(cat) {
  const base = ['categoria'];
  if (cat === 'cibi_bevande') base.push('pasto');
  base.push('tipo', 'importo', 'foto');
  return base;
}

function currentSteps() {
  return stepsForCategoria(state.categoria);
}

function renderChoices(list, selected, onPick) {
  return list.map(item => {
    const sel = selected === item.id ? ' is-selected' : '';
    return '<button type="button" class="choice-btn' + sel + '" data-id="' + item.id + '">' + item.label + '</button>';
  }).join('');
}

const ICO_INFO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>';

function renderLista() {
  const box = document.getElementById('lista-esistenti');
  const list = SRNotaSpese.parseNotaSpeseJson(state.tappa && state.tappa.nota_spese_json);
  if (!list.length) {
    box.innerHTML = '<p class="empty">Nessun giustificativo su questa tappa.</p>';
    return;
  }
  const catMap = Object.fromEntries(SRNotaSpese.CATEGORIE.map(c => [c.id, c.label]));
  box.innerHTML = list.map((it, i) => {
    const cat = catMap[it.categoria] || it.categoria;
    const pasto = it.pasto ? ' · ' + it.pasto : '';
    const euro = Number(it.importo).toFixed(2).replace('.', ',');
    return '<button type="button" class="list-item" data-view-idx="' + i + '" title="Apri giustificativo">'
      + '<span class="list-item-main">' + (it.tipo || '') + ' · ' + cat + pasto + '</span>'
      + '<strong class="list-item-amt">€ ' + euro + '</strong>'
      + '<span class="list-item-info">' + ICO_INFO + '</span>'
      + '</button>';
  }).join('');
  box.querySelectorAll('[data-view-idx]').forEach(btn => {
    btn.addEventListener('click', () => apriNotaViewer(list[Number(btn.dataset.viewIdx)]));
  });
}

function apriNotaViewer(it) {
  if (!it) return;
  const img = document.getElementById('ns-view-img');
  img.onerror = () => { img.style.display = 'none'; };
  img.style.display = '';
  img.src = SRScontrini.thumbnailUrl(it);
  const tipo = String(it.tipo || '').toLowerCase() === 'fattura' ? 'Fattura' : 'Scontrino';
  document.getElementById('ns-view-title').textContent = tipo;
  const pasto = it.pasto ? ' · ' + it.pasto : '';
  document.getElementById('ns-view-cat').textContent =
    (SRNotaSpese.labelCategoria(it.categoria) || it.categoria || '—') + pasto;
  document.getElementById('ns-view-importo').textContent =
    '€ ' + Number(it.importo).toFixed(2).replace('.', ',');
  document.getElementById('ns-view-orario').textContent = it.created_at
    ? new Date(it.created_at).toLocaleString('it-IT')
    : '—';
  const a = document.getElementById('ns-view-download');
  a.innerHTML = SRScontrini.ICO_DOWNLOAD;
  a.href = SRScontrini.downloadUrl(it);
  a.setAttribute('download', 'giustificativo.png');
  const printBtn = document.getElementById('ns-view-print');
  printBtn.innerHTML = SRScontrini.ICO_PRINT;
  printBtn.onclick = () => {
    const w = window.open('', '_blank');
    if (!w) return;
    const src = SRScontrini.thumbnailUrl(it);
    w.document.write('<title>Giustificativo</title><img src="' + src.replace(/"/g, '') + '" style="max-width:100%">');
    w.document.close();
    setTimeout(() => w.print(), 400);
  };
  const bd = document.getElementById('nota-view-backdrop');
  bd.classList.add('open');
  bd.setAttribute('aria-hidden', 'false');
}

function chiudiNotaViewer() {
  const bd = document.getElementById('nota-view-backdrop');
  bd.classList.remove('open');
  bd.setAttribute('aria-hidden', 'true');
}

function renderStep() {
  const steps = currentSteps();
  const key = steps[state.step] || 'categoria';
  const title = {
    categoria: 'Categoria',
    pasto: 'Pasto',
    tipo: 'Documento',
    importo: 'Importo speso',
    foto: 'Foto giustificativo'
  }[key];
  document.getElementById('step-title').textContent = title;
  const body = document.getElementById('step-body');
  document.getElementById('btn-back').style.visibility = state.step === 0 ? 'hidden' : 'visible';
  document.getElementById('btn-next').textContent = key === 'foto' ? 'Salva' : 'Avanti';

  if (key === 'categoria') {
    body.innerHTML = '<div class="choice-grid">' + renderChoices(SRNotaSpese.CATEGORIE, state.categoria) + '</div>';
    body.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.categoria = btn.dataset.id;
        if (state.categoria !== 'cibi_bevande') state.pasto = null;
        renderStep();
      });
    });
  } else if (key === 'pasto') {
    body.innerHTML = '<div class="choice-grid">' + renderChoices(SRNotaSpese.PASTI, state.pasto) + '</div>';
    body.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => { state.pasto = btn.dataset.id; renderStep(); });
    });
  } else if (key === 'tipo') {
    body.innerHTML = '<div class="choice-grid">' + renderChoices(SRNotaSpese.TIPI, state.tipo) + '</div>';
    body.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => { state.tipo = btn.dataset.id; renderStep(); });
    });
  } else if (key === 'importo') {
    body.innerHTML = '<div class="field"><label for="ns-importo">Euro</label>'
      + '<input type="text" id="ns-importo" inputmode="decimal" placeholder="es. 12,50" value="'
      + (state.importo || '') + '"></div>';
    const inp = document.getElementById('ns-importo');
    inp.addEventListener('input', () => { state.importo = inp.value; });
    inp.focus();
  } else if (key === 'foto') {
    const prev = state.photo
      ? '<img class="preview" alt="Anteprima" src="' + state.photo.dataUrl + '">'
      : '<p class="empty">Scatta o scegli una foto dello scontrino/fattura.</p>';
    body.innerHTML = '<div class="photo-actions">'
      + '<button type="button" class="btn btn-ghost" id="btn-cam">Fotocamera</button>'
      + '<button type="button" class="btn btn-ghost" id="btn-gal">Galleria</button>'
      + '</div>' + prev;
    document.getElementById('btn-cam').onclick = () => document.getElementById('file-camera').click();
    document.getElementById('btn-gal').onclick = () => document.getElementById('file-gallery').click();
  }
}

function canAdvance() {
  const key = currentSteps()[state.step];
  if (key === 'categoria') return !!state.categoria;
  if (key === 'pasto') return !!state.pasto;
  if (key === 'tipo') return !!state.tipo;
  if (key === 'importo') {
    try { SRNotaSpese.parseImporto(state.importo); return true; } catch { return false; }
  }
  if (key === 'foto') return !!(state.photo && state.photo.dataUrl);
  return false;
}

function readFile(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function onFile(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  if (!file.type.startsWith('image/')) return toast('Solo immagini', 'err');
  const dataUrl = await readFile(file);
  state.photo = { dataUrl, mime: file.type || 'image/jpeg' };
  renderStep();
}

document.getElementById('file-camera').addEventListener('change', e => onFile(e.target));
document.getElementById('file-gallery').addEventListener('change', e => onFile(e.target));

document.getElementById('btn-back').addEventListener('click', () => {
  if (state.step > 0) {
    state.step -= 1;
    renderStep();
  }
});

async function postGoogleScript(payload) {
  const url = (SR_CONFIG || {}).GOOGLE_SCRIPT_URL;
  if (!url || String(url).includes('INSERISCI')) throw new Error('GOOGLE_SCRIPT_URL non configurato');
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const text = await resp.text();
  let data;
  try { data = JSON.parse(text); } catch { throw new Error('Risposta Drive non valida'); }
  if (!data.ok) throw new Error(data.message || 'Upload Drive fallito');
  return data;
}

async function salva() {
  if (!canAdvance()) return toast('Completa il passo corrente', 'err');
  const u = SRAuth.getUser() || {};
  showLoader('Caricamento foto su Drive…');
  try {
    const up = await postGoogleScript({
      action: 'uploadNotaSpesa',
      photo: state.photo.dataUrl,
      email: u.email || '',
      trasferta_id: String(state.tappa.trasferta_id || ''),
      tappa_numero: String(state.tappa.tappa_numero || '')
    });
    showLoader('Salvataggio in archivio…');
    const item = {
      id: SRNotaSpese.uid(),
      tipo: state.tipo,
      categoria: state.categoria,
      pasto: state.pasto,
      importo: state.importo,
      foto_url: up.url,
      foto_id: up.fileId,
      mime: up.mime || state.photo.mime
    };
    const resp = await SRAuth.fetch(SR_CONFIG.WEBHOOK_APPEND_NOTA_SPESA, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'append_nota_spesa',
        id: Number(state.tappa.id),
        nota: item
      })
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok || data.ok === false || data.action === 'error') {
      throw new Error(data.message || ('Salvataggio fallito: ' + resp.status));
    }
    const json = data.nota_spese_json || SRNotaSpese.stringify(data.note || SRNotaSpese.appendNotaSpesa(state.tappa.nota_spese_json, item));
    SRAuth.updateTappaNotaSpese(state.tappa.id, json, data.note);
    const refreshed = SRAuth.getTrasferteTappe().find(r => Number(r.id) === Number(state.tappa.id));
    if (refreshed) state.tappa = refreshed;
    state.step = 0;
    state.categoria = null;
    state.pasto = null;
    state.tipo = null;
    state.importo = '';
    state.photo = null;
    renderLista();
    renderStep();
    hideLoader();
    toast('Giustificativo salvato', 'ok');
  } catch (e) {
    hideLoader();
    toast(e.message || String(e), 'err');
  }
}

document.getElementById('btn-next').addEventListener('click', () => {
  if (!canAdvance()) return toast('Completa il passo corrente', 'err');
  const steps = currentSteps();
  if (state.step >= steps.length - 1) {
    salva();
    return;
  }
  state.step += 1;
  renderStep();
});

document.getElementById('ns-view-chiudi').addEventListener('click', chiudiNotaViewer);
document.getElementById('nota-view-backdrop').addEventListener('click', e => {
  if (e.target.id === 'nota-view-backdrop') chiudiNotaViewer();
});

(async function boot() {
  try {
    if (!SRAuth.hasN8nToken()) await SRAuth.ensureN8nSession();
    if (!SRAuth.canAccessHubApp('nota_spese')) {
      location.replace('index.html');
      return;
    }
    const tappe = SRAuth.getTrasferteTappe();
    const tappa = SRNotaSpese.tappaAttuale(tappe);
    if (!tappa) {
      document.getElementById('no-tappa').classList.remove('hidden');
      return;
    }
    state.tappa = tappa;
    document.getElementById('panel').classList.remove('hidden');
    document.getElementById('tappa-label').innerHTML =
      SRNotaSpese.labelTappa(tappa)
      + '<small>' + (tappa.trasferta_id || '') + (tappa.cliente_tappa ? ' · ' + tappa.cliente_tappa : '') + '</small>';
    renderLista();
    renderStep();
  } catch (ex) {
    if (SRAuth.isNotEnabledError(ex)) SRAuth.redirectNotEnabled();
    else SRAuth.redirectToLogin('api');
  }
})();
</script>
</body>
</html>
