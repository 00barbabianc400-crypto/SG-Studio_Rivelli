<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gestione amministrativa — Studio Rivelli</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --font-body: "DM Sans", sans-serif;
  --bg: #f3f4f6;
  --surface: #ffffff;
  --hover: #f3f4f6;
  --border: #eceef2;
  --text: #111827;
  --muted: #6b7280;
  --faint: #9ca3af;
  --accent: #2563eb;
  --accent-soft: #eff6ff;
  --green: #166534;
  --green-soft: #e8f5e9;
  --danger: #dc2626;
  --orange: #f97316;
  --shadow: 0 8px 30px rgba(17, 24, 39, 0.08), 0 2px 8px rgba(17, 24, 39, 0.04);
  --shadow-sm: 0 2px 8px rgba(17, 24, 39, 0.06);
  --radius: 16px;
  --radius-sm: 12px;
  --radius-pill: 999px;
  --icon: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body); background: var(--bg); color: var(--text);
  min-height: 100vh; min-height: 100dvh;
}

.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 20px; height: 60px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm);
}
.topbar-brand { display: flex; align-items: center; gap: 12px; }
.topbar-home {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 500;
  padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--surface); box-shadow: var(--shadow-sm); transition: background .15s;
}
.topbar-home:hover { background: var(--hover); color: var(--text); }
.topbar-home svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.topbar-title { font-size: 15px; font-weight: 700; color: var(--text); }
.topbar-title span { font-weight: 500; color: var(--muted); }

.shell { max-width: min(1080px, calc(100vw - 32px)); margin: 0 auto; padding: 28px 16px 64px; }
.page-head { margin-bottom: 20px; }
.page-title { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
.page-sub { font-size: 14px; color: var(--muted); margin-top: 6px; line-height: 1.45; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); margin-bottom: 18px; overflow: hidden;
}
.card-head {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; background: #fafafa;
}
.card-icon {
  width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--accent-soft);
  display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0;
}
.card-icon svg { width: var(--icon); height: var(--icon); stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.card-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.card-body { padding: 18px; }

.field-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
.field { flex: 1; min-width: 150px; }
.field label {
  display: block; font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px;
}
.field select, .field input {
  width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 12px; font-family: inherit; font-size: 14px; color: var(--text);
  background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s;
}
.field select:focus, .field input:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
}

.soft-btn {
  height: 44px; padding: 0 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--shadow-sm);
  transition: background .15s;
}
.soft-btn:hover { background: var(--hover); }
.soft-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.soft-btn.primary {
  background: var(--accent); color: #fff; border-color: transparent;
}
.soft-btn.primary:hover { background: #1d4ed8; }
.action-bar { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

.status-line { font-size: 13px; color: var(--muted); margin-bottom: 12px; min-height: 1.2em; }
.status-line.is-error { color: var(--danger); }

.year-nav {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-bottom: 14px; flex-wrap: wrap;
}
.year-nav h2 { font-size: 18px; font-weight: 700; color: var(--text); }
.year-nav-btns { display: flex; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--surface); box-shadow: var(--shadow-sm); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; color: var(--text);
  transition: background .15s;
}
.icon-btn:hover { background: var(--hover); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }

.month-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
@media (max-width: 800px) { .month-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 520px) { .month-grid { grid-template-columns: repeat(2, 1fr); } }

.month-tile {
  position: relative; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); padding: 14px 12px 16px; text-align: left;
  cursor: pointer; box-shadow: var(--shadow-sm); transition: background .15s, border-color .15s, box-shadow .15s;
  font-family: inherit; color: inherit;
}
.month-tile:hover { background: var(--hover); border-color: #dde1e8; }
.month-tile.has-data { border-color: #dbeafe; background: #f8fbff; }
.month-tile.has-data:hover { background: var(--accent-soft); }
.month-tile.is-open {
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
  background: var(--accent-soft);
}
.month-tile-name { font-size: 13px; font-weight: 600; color: var(--text); }
.month-tile-count { font-size: 11px; color: var(--muted); margin-top: 4px; }
.month-bang {
  position: absolute; top: 10px; right: 10px;
  width: 22px; height: 22px; border-radius: var(--radius-pill);
  background: #fff7ed; color: var(--orange); border: 1px solid #fed7aa;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; line-height: 1;
}

.month-panel { margin-top: 16px; display: none; }
.month-panel.open { display: block; }
.month-panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-bottom: 12px; flex-wrap: wrap;
}
.month-panel-head h3 { font-size: 16px; font-weight: 700; }

.oc-cal {
  --oc-week-min: 110px; --oc-day-num: 14px; --oc-bar-h: 22px; --oc-bar-top: 34px;
  border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface);
}
.oc-wd-head {
  display: grid; grid-template-columns: repeat(7, 1fr);
  background: #111827; color: rgba(255,255,255,.88);
}
.oc-wd-head span {
  text-align: center; font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .04em; padding: 10px 4px;
}
.oc-wd-head span.is-wknd { color: #fdba74; }
.oc-week {
  display: grid; grid-template-columns: repeat(7, 1fr);
  position: relative; min-height: var(--oc-week-min);
  border-top: 1px solid var(--border);
}
.oc-day {
  border-right: 1px solid #f1f3f6; min-height: var(--oc-week-min); padding: 8px 5px 6px;
  background: var(--surface);
}
.oc-day:last-child { border-right: none; }
.oc-day.is-out { background: #f9fafb; }
.oc-day.is-wknd:not(.is-out) { background: #fcfcfd; }
.oc-day.is-today .oc-day-num {
  background: var(--accent); color: #fff; border-radius: var(--radius-pill);
  width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;
}
.oc-day-num {
  font-family: 'DM Mono', monospace; font-size: var(--oc-day-num); font-weight: 600;
  color: var(--text); line-height: 1; margin-bottom: 4px;
}
.oc-day.is-out .oc-day-num { color: var(--faint); font-weight: 500; }
.oc-week-bars {
  position: absolute; left: 0; right: 0; top: var(--oc-bar-top);
  bottom: 6px; pointer-events: none;
}
.oc-bar {
  position: absolute; height: var(--oc-bar-h); border: none; cursor: pointer;
  font-size: 11px; font-weight: 600; color: #fff; font-family: inherit;
  display: flex; align-items: center; padding: 0 8px; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis; pointer-events: auto;
  box-shadow: 0 2px 5px rgba(17, 24, 39, .16); transition: transform .12s, box-shadow .12s;
}
.oc-bar:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(17, 24, 39, .2); z-index: 2; }
.oc-bar.round-l { border-radius: 6px 0 0 6px; }
.oc-bar.round-r { border-radius: 0 6px 6px 0; }
.oc-bar.round-l.round-r { border-radius: 6px; }

.tag {
  display: inline-block; padding: 3px 10px; border-radius: var(--radius-pill);
  font-size: 11px; font-weight: 600;
}
.tag-trasferta { background: var(--accent-soft); color: #1d4ed8; }
.tag-roma { background: #fff7ed; color: #c2410c; }

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(17, 24, 39, .4); z-index: 1000;
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  border: 1px solid var(--border); width: min(440px, calc(100vw - 32px));
  max-height: min(88vh, 720px); overflow: auto;
}
.modal-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--border); }
.modal-head h2 { font-size: 16px; font-weight: 700; }
.modal-body { padding: 16px 20px; }
.modal-foot {
  padding: 12px 20px 18px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap;
}
.detail-op {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 16px; font-weight: 700; margin-bottom: 4px;
  border: none; background: transparent; padding: 0; cursor: pointer;
  font-family: inherit; color: var(--accent); text-align: left;
}
.detail-op:hover { text-decoration: underline; }
.detail-op-dot { width: 10px; height: 10px; border-radius: var(--radius-pill); flex-shrink: 0; }
.detail-card dt { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--faint); margin-top: 12px; }
.detail-card dt:first-of-type { margin-top: 10px; }
.detail-card dd { margin: 4px 0 0; font-size: 14px; color: var(--text); line-height: 1.45; }
.tappe-box { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); }
.tappe-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
.tappa {
  background: var(--hover); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 12px; margin-bottom: 8px; font-size: 13px;
}
.tappa:last-child { margin-bottom: 0; }
.tappa-row { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--muted); }
.tappa-row b { color: var(--text); font-weight: 600; }
.tappa-note { margin-top: 6px; font-style: italic; color: var(--faint); }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(12px);
  background: #111827; color: #fff; padding: 12px 16px; border-radius: var(--radius-sm);
  font-size: 13px; opacity: 0; pointer-events: none; transition: .18s; z-index: 2000;
  max-width: min(420px, calc(100vw - 32px)); box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--danger); }

@media (max-width: 640px) {
  .shell { max-width: 100%; padding: 20px 12px 48px; }
  .field { min-width: 100%; }
}
</style>
</head>
<body>

  <div class="topbar-brand">

      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>

    </a>

      <button type="button" class="soft-btn" id="detail-close">Chiudi</button>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.0/lib/msal-browser.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
const WEBHOOK = SR_CONFIG.WEBHOOK_GESTIONE_AMMINISTRATIVA;
const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const MESI_SHORT = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const WD = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const OP_PALETTE = ['#2563eb','#0d9488','#7c3aed','#b45309','#db2777','#0891b2','#059669','#6366f1','#ea580c'];

let rawPrenotazioni = [];
let rawTappe = [];
let filtered = [];
let viewYear = new Date().getFullYear();
let openMonth = null; /* 0-11 or null */
let operatorNames = [];

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 3200);
}

function normalizeDateStr(val) {
  if (val == null || val === '') return '';
  const s = String(val).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const it = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})/);
  if (it) return `${it[3]}-${String(it[2]).padStart(2,'0')}-${String(it[1]).padStart(2,'0')}`;
  const d = new Date(s);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-CA', { timeZone: 'Europe/Rome' });
}

function pickDateField(row, keys) {
  for (const k of keys) {
    if (row[k] != null && row[k] !== '') return normalizeDateStr(row[k]);
  }
  return '';
}

function pickCliente(row) {
  if (!row) return '';
  const v = row.note ?? row.Cliente ?? row.cliente;
  return v != null ? String(v).trim() : '';
}

function fmtDateIt(val) {
  const iso = normalizeDateStr(val);
  if (!iso) return '—';
  const d = new Date(iso + 'T12:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
}

function fmtPeriodoIt(da, a) {
  const d1 = normalizeDateStr(da);
  const d2 = normalizeDateStr(a);
  if (!d1 && !d2) return '—';
  if (!d2 || d1 === d2) return fmtDateIt(d1);
  return `${fmtDateIt(d1)} → ${fmtDateIt(d2)}`;
}

function rangesOverlap(a1, a2, b1, b2) {
  if (!a1 || !a2 || !b1 || !b2) return false;
  return a1 <= b2 && b1 <= a2;
}

function normName(s) {
  return String(s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}

function namesMatch(a, b) {
  const na = normName(a);
  const nb = normName(b);
  if (!na || !nb) return false;
  if (na === nb) return true;
  const pa = na.split(' ').filter(Boolean);
  const pb = nb.split(' ').filter(Boolean);
  if (!pa.length || !pb.length) return false;
  const cognA = pa[pa.length - 1];
  const cognB = pb[pb.length - 1];
  if (cognA !== cognB) return false;
  const setB = new Set(pb);
  const shared = pa.filter(p => p !== cognA && setB.has(p));
  return shared.length > 0 || (pa.length === 1 && pb.length === 1);
}

function unwrapRows(data) {
  if (!data) return [];
  if (Array.isArray(data)) return data;
  if (Array.isArray(data.body)) return data.body;
  if (Array.isArray(data.data)) return data.data;
  if (data.json) return unwrapRows(data.json);
  return [data];
}

function isPrenotazioneMacchina(row) {
  return !!(row && (row.tipo_utilizzo != null || (row.operatore != null && row.data_da != null && !row.trasferta_id)));
}

function isTappaTrasferta(row) {
  return !!(row && (row.trasferta_id != null || (row.nome_persona != null && row.citta != null)));
}

function splitPayload(data) {
  const rows = unwrapRows(data).filter(Boolean);
  const prenotazioni = [];
  const tappe = [];
  rows.forEach(r => {
    if (isPrenotazioneMacchina(r)) {
      prenotazioni.push({
        ...r,
        Cliente: pickCliente(r),
        data_da: pickDateField(r, ['data_da', 'dataDa', 'Data_da', 'dal', 'data_inizio']),
        data_a: pickDateField(r, ['data_a', 'dataA', 'Data_a', 'al', 'data_fine'])
          || pickDateField(r, ['data_da', 'dataDa', 'Data_da', 'dal', 'data_inizio'])
      });
    } else if (isTappaTrasferta(r)) {
      tappe.push({
        ...r,
        data_arrivo: pickDateField(r, ['data_arrivo', 'dataArrivo', 'arrivo', 'data_da', 'dal']),
        data_partenza: pickDateField(r, ['data_partenza', 'dataPartenza', 'partenza', 'data_a', 'al'])
          || pickDateField(r, ['data_arrivo', 'dataArrivo', 'arrivo', 'data_da', 'dal'])
      });
    }
  });
  return { prenotazioni, tappe };
}

function toISO(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

function colorOperatore(name) {
  const i = Math.max(0, operatorNames.indexOf(name));
  return OP_PALETTE[i % OP_PALETTE.length];
}

function cognomeOperatore(name) {
  if (!name) return '—';
  const parts = String(name).trim().split(/\s+/);
  return parts.length > 1 ? parts[parts.length - 1] : parts[0];
}

function setStatus(msg, cls) {
  const el = document.getElementById('status-line');
  el.textContent = msg;
  el.className = 'status-line' + (cls ? ' ' + cls : '');
}

function leggiFiltri() {
  let dal = document.getElementById('f-dal').value || '';
  let al = document.getElementById('f-al').value || '';
  if (dal && al && al < dal) {
    const tmp = dal; dal = al; al = tmp;
    document.getElementById('f-dal').value = dal;
    document.getElementById('f-al').value = al;
  }
  return {
    operatore: document.getElementById('f-operatore').value,
    dal,
    al
  };
}

/** Nome restringe; date, se presenti, restringono ulteriormente (AND). */
function applyFilters() {
  const f = leggiFiltri();
  filtered = rawPrenotazioni.filter(p => {
    if (f.operatore && !namesMatch(p.operatore, f.operatore)) return false;
    if (f.dal && f.al) {
      if (!rangesOverlap(p.data_da, p.data_a, f.dal, f.al)) return false;
    } else if (f.dal) {
      if (!p.data_a || p.data_a < f.dal) return false;
    } else if (f.al) {
      if (!p.data_da || p.data_da > f.al) return false;
    }
    return true;
  });
  const n = filtered.length;
  const bits = [];
  if (f.operatore) bits.push(f.operatore);
  if (f.dal || f.al) bits.push((f.dal || '…') + ' → ' + (f.al || '…'));
  setStatus(
    n + ' prenotazion' + (n === 1 ? 'e' : 'i')
    + (bits.length ? ' · ' + bits.join(' · ') : '')
  );
  renderYearGrid();
  if (openMonth != null) renderMonthCalendar(openMonth);
}

function popolaOperatoriDaRecord() {
  const set = new Map();
  rawPrenotazioni.forEach(p => {
    const name = String(p.operatore || '').trim();
    if (!name) return;
    const key = normName(name);
    if (!set.has(key)) set.set(key, name);
  });
  operatorNames = [...set.values()].sort((a, b) => a.localeCompare(b, 'it'));
  const sel = document.getElementById('f-operatore');
  const prev = sel.value;
  sel.innerHTML = '<option value="">— tutti —</option>'
    + operatorNames.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
  if (prev && operatorNames.some(o => namesMatch(o, prev))) {
    const match = operatorNames.find(o => namesMatch(o, prev));
    sel.value = match || '';
  }
}

function countInMonth(year, month) {
  const start = toISO(year, month, 1);
  const end = toISO(year, month, new Date(year, month + 1, 0).getDate());
  return filtered.filter(p => rangesOverlap(p.data_da, p.data_a, start, end)).length;
}

function renderYearGrid() {
  document.getElementById('year-label').textContent = String(viewYear);
  const grid = document.getElementById('month-grid');
  grid.innerHTML = MESI_SHORT.map((label, m) => {
    const n = countInMonth(viewYear, m);
    const has = n > 0;
    const open = openMonth === m;
    return `<button type="button" class="month-tile${has ? ' has-data' : ''}${open ? ' is-open' : ''}" data-month="${m}">
      ${has ? '<span class="month-bang" title="Ci sono prenotazioni">!</span>' : ''}
      <div class="month-tile-name">${label}</div>
      <div class="month-tile-count">${has ? n + (n === 1 ? ' record' : ' record') : 'vuoto'}</div>
    </button>`;
  }).join('');
  grid.querySelectorAll('.month-tile').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = Number(btn.dataset.month);
      if (openMonth === m) {
        openMonth = null;
        document.getElementById('month-panel').classList.remove('open');
        renderYearGrid();
        return;
      }
      openMonth = m;
      renderYearGrid();
      renderMonthCalendar(m);
    });
  });
}

function buildMonthWeeks(year, month) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const padStart = (new Date(year, month, 1).getDay() + 6) % 7;
  const cells = [];
  for (let i = 0; i < padStart; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(toISO(year, month, d));
  while (cells.length % 7) cells.push(null);
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
}

function barSegmentInWeek(p, weekDays) {
  let colStart = -1, colEnd = -1;
  weekDays.forEach((iso, idx) => {
    if (!iso || iso < p.data_da || iso > p.data_a) return;
    if (colStart < 0) colStart = idx;
    colEnd = idx;
  });
  if (colStart < 0) return null;
  return {
    colStart,
    colEnd,
    roundL: weekDays[colStart] === p.data_da,
    roundR: weekDays[colEnd] === p.data_a
  };
}

function segmentsOverlap(a, b) {
  return a.colStart <= b.colEnd && b.colStart <= a.colEnd;
}

function assignBarLanes(bookings, weekDays) {
  const items = bookings
    .map(p => ({ p, seg: barSegmentInWeek(p, weekDays) }))
    .filter(x => x.seg)
    .sort((a, b) => (a.p.data_da || '').localeCompare(b.p.data_da || '') || Number(a.p.id) - Number(b.p.id));
  const laneEnds = [];
  items.forEach(item => {
    let lane = 0;
    while (laneEnds[lane]?.some(seg => segmentsOverlap(item.seg, seg))) lane++;
    if (!laneEnds[lane]) laneEnds[lane] = [];
    laneEnds[lane].push(item.seg);
    item.lane = lane;
  });
  return items;
}

function renderMonthCalendar(month) {
  const panel = document.getElementById('month-panel');
  panel.classList.add('open');
  document.getElementById('month-panel-title').textContent = MESI[month] + ' ' + viewYear;

  const daysInMonth = new Date(viewYear, month + 1, 0).getDate();
  const monthStart = toISO(viewYear, month, 1);
  const monthEnd = toISO(viewYear, month, daysInMonth);
  const inMonth = filtered.filter(p => rangesOverlap(p.data_da, p.data_a, monthStart, monthEnd));
  const weeks = buildMonthWeeks(viewYear, month);
  const todayIso = new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/Rome' });
  const barH = 22;
  const barGap = 4;

  let wdHead = WD.map((w, i) => `<span class="${i >= 5 ? 'is-wknd' : ''}">${w}</span>`).join('');
  let weeksHtml = '';
  weeks.forEach(weekDays => {
    const valid = weekDays.filter(Boolean);
    const wStart = valid[0] || monthStart;
    const wEnd = valid[valid.length - 1] || monthEnd;
    const weekBookings = inMonth.filter(p => rangesOverlap(p.data_da, p.data_a, wStart, wEnd));
    const barItems = assignBarLanes(weekBookings, weekDays);
    const maxLane = barItems.reduce((m, x) => Math.max(m, x.lane), -1);
    const weekMin = 100 + Math.max(0, maxLane) * (barH + barGap);

    let daysHtml = '';
    weekDays.forEach(iso => {
      if (!iso) {
        daysHtml += '<div class="oc-day is-out"></div>';
        return;
      }
      const d = Number(iso.slice(8, 10));
      const dow = new Date(iso + 'T12:00:00').getDay();
      const cls = (dow === 0 || dow === 6 ? ' is-wknd' : '') + (iso === todayIso ? ' is-today' : '');
      daysHtml += `<div class="oc-day${cls}"><div class="oc-day-num">${d}</div></div>`;
    });

    let barsHtml = '';
    barItems.forEach(({ p, seg, lane }) => {
      const colW = 100 / 7;
      const left = seg.colStart * colW;
      const width = (seg.colEnd - seg.colStart + 1) * colW;
      const top = lane * (barH + barGap);
      const col = colorOperatore(p.operatore);
      const rCls = (seg.roundL ? ' round-l' : '') + (seg.roundR ? ' round-r' : '');
      barsHtml += `<button type="button" class="oc-bar${rCls}" data-id="${esc(p.id)}"
        style="left:calc(${left}% + 3px);width:calc(${width}% - 6px);top:${top}px;background:${col}"
        title="${esc(p.operatore)} · ${esc(pickCliente(p))}">${esc(cognomeOperatore(p.operatore))}</button>`;
    });

    weeksHtml += `<div class="oc-week" style="min-height:${weekMin}px">${daysHtml}<div class="oc-week-bars">${barsHtml}</div></div>`;
  });

  const wrap = document.getElementById('oc-wrap');
  wrap.innerHTML = `<div class="oc-cal"><div class="oc-wd-head">${wdHead}</div>${weeksHtml}</div>`;
  wrap.querySelectorAll('.oc-bar').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      apriDettaglio(btn.dataset.id);
    });
  });
}

function tappePerPrenotazione(p) {
  if (p.tipo_utilizzo !== 'Trasferta') return [];
  return rawTappe
    .filter(t => namesMatch(t.nome_persona, p.operatore)
      && rangesOverlap(p.data_da, p.data_a, t.data_arrivo, t.data_partenza))
    .sort((a, b) => Number(a.tappa_numero || 0) - Number(b.tappa_numero || 0)
      || (a.data_arrivo || '').localeCompare(b.data_arrivo || ''));
}

function apriDettaglio(id) {
  const p = filtered.find(x => String(x.id) === String(id))
    || rawPrenotazioni.find(x => String(x.id) === String(id));
  if (!p) return;
  const col = colorOperatore(p.operatore);
  const tagCls = p.tipo_utilizzo === 'Roma e dintorni' ? 'tag-roma' : 'tag-trasferta';
  const linked = tappePerPrenotazione(p);
  let tappeHtml = '';
  if (p.tipo_utilizzo === 'Trasferta') {
    if (!linked.length) {
      tappeHtml = `<div class="tappe-box"><div class="tappe-title">Tappe trasferte</div>
        <p style="font-size:13px;color:var(--muted)">Nessuna tappa collegata per operatore e date.</p></div>`;
    } else {
      tappeHtml = `<div class="tappe-box"><div class="tappe-title">Tappe trasferte · ${linked.length}</div>`
        + linked.map(t => `
          <div class="tappa">
            <div class="tappa-row">
              <span><b>Tappa ${esc(t.tappa_numero || '—')}</b> · ${esc(t.citta || '—')}</span>
              <span>${esc(fmtPeriodoIt(t.data_arrivo, t.data_partenza))}</span>
            </div>
            <div class="tappa-row" style="margin-top:6px">
              <span>Cliente: <b>${esc(t.cliente_tappa || '—')}</b></span>
              <span>Mezzo: <b>${esc(t.mezzo_raggiungimento || '—')}</b></span>
              <span>Stato: <b>${esc(t.stato_prenotazioni || '—')}</b></span>
            </div>
            ${t.note_tappa ? `<div class="tappa-note">${esc(t.note_tappa)}</div>` : ''}
          </div>`).join('')
        + '</div>';
    }
  }
  document.getElementById('detail-body').innerHTML = `
    <button type="button" class="detail-op" id="detail-filter-op" data-op="${esc(p.operatore)}">
      <span class="detail-op-dot" style="background:${col}"></span>
      ${esc(p.operatore)}
    </button>
    <dl>
      <dt>Tipo utilizzo</dt>
      <dd><span class="tag ${tagCls}">${esc(p.tipo_utilizzo || '—')}</span></dd>
      <dt>Periodo auto</dt>
      <dd>${esc(fmtPeriodoIt(p.data_da, p.data_a))}</dd>
      <dt>Cliente</dt>
      <dd>${esc(pickCliente(p) || '—')}</dd>
    </dl>
    ${tappeHtml}`;
  document.getElementById('detail-backdrop').classList.add('open');
  const filterBtn = document.getElementById('detail-filter-op');
  if (filterBtn) {
    filterBtn.addEventListener('click', () => {
      const name = filterBtn.dataset.op;
      const match = operatorNames.find(o => namesMatch(o, name)) || name;
      document.getElementById('f-operatore').value = match;
      document.getElementById('detail-backdrop').classList.remove('open');
      applyFilters();
    });
  }
}

async function caricaDati() {
  setStatus('Caricamento dati…');
  try {
    await SRAuth.ensureN8nSession();
    const resp = await SRAuth.fetch(WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    const data = await resp.json().catch(() => ([]));
    if (!resp.ok) throw new Error((data && data.message) || ('HTTP ' + resp.status));
    const split = splitPayload(data);
    rawPrenotazioni = split.prenotazioni;
    rawTappe = split.tappe;
    popolaOperatoriDaRecord();
    applyFilters();
  } catch (e) {
    setStatus('Errore caricamento: ' + (e.message || e), 'is-error');
    showToast('Errore: ' + (e.message || e), 'error');
  }
}

(async function boot() {
  try {
    await SRAuth.init();
    if (!(await SRAuth.isMsalLoggedIn())) {
      location.replace('index.html');
      return;
    }
    await caricaDati();
  } catch (e) {
    setStatus('Sessione non disponibile. Torna alla Home e accedi.', 'is-error');
  }
})();

document.getElementById('f-operatore').addEventListener('change', applyFilters);
document.getElementById('f-dal').addEventListener('change', applyFilters);
document.getElementById('f-al').addEventListener('change', applyFilters);
document.getElementById('btn-reset').addEventListener('click', () => {
  document.getElementById('f-operatore').value = '';
  document.getElementById('f-dal').value = '';
  document.getElementById('f-al').value = '';
  openMonth = null;
  document.getElementById('month-panel').classList.remove('open');
  applyFilters();
});
document.getElementById('year-prev').addEventListener('click', () => {
  viewYear--;
  openMonth = null;
  document.getElementById('month-panel').classList.remove('open');
  renderYearGrid();
});
document.getElementById('year-next').addEventListener('click', () => {
  viewYear++;
  openMonth = null;
  document.getElementById('month-panel').classList.remove('open');
  renderYearGrid();
});
document.getElementById('month-close').addEventListener('click', () => {
  openMonth = null;
  document.getElementById('month-panel').classList.remove('open');
  renderYearGrid();
});
document.getElementById('detail-close').addEventListener('click', () => {
  document.getElementById('detail-backdrop').classList.remove('open');
});
document.getElementById('detail-backdrop').addEventListener('click', e => {
  if (e.target.id === 'detail-backdrop') e.currentTarget.classList.remove('open');
});
</script>
